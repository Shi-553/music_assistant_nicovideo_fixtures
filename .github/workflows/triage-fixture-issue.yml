name: Triage Fixture Issue

on:
  # Called by update-fixtures.yml with the issue it just opened
  workflow_call:
    inputs:
      issue_number:
        description: 'Fixture-update issue number to triage'
        required: true
        type: string

  # Manual re-triage of a specific issue
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Fixture-update issue number to triage'
        required: true
        type: string

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: write  # Push stabilizer / version-pin fixes
  issues: write    # Comment on and close the issue
  actions: read    # Read the fixture workflow's runs and logs

concurrency:
  group: triage-fixture-issue-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage fixture issue
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The branch head, not the triggering sha: the update job may have just pushed fixtures
          ref: ${{ github.ref_name }}
          fetch-depth: 0  # The skill reads fixture history with git log -p

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run triage skill
        uses: anthropics/claude-code-action@v1
        env:
          NICONICO_SESSION: ${{ secrets.NICONICO_SESSION }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Run the /triage-fixture-issue skill on issue #${{ inputs.issue_number }}
            in ${{ github.repository }}, following its "7. 自動実行モード" section.
            The target branch is `${{ github.ref_name }}`: push fixes only to this branch.
            Also handle any other open fixture-update issues that share the same cause.
          claude_args: |
            --model sonnet
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,Bash(git:*),Bash(gh:*),Bash(python:*),Bash(.venv/bin/python:*),Bash(.venv/bin/ruff:*),Bash(.venv/bin/mypy:*),Bash(scripts/run_fixture_generator.sh:*),Bash(./scripts/run_fixture_generator.sh:*),Bash(source .venv/bin/activate:*),Bash(. .venv/bin/activate:*),Bash(curl -s https://pypi.org/:*),Bash(curl -sS https://pypi.org/:*),Bash(grep:*),Bash(sed:*),Bash(head:*),Bash(tail:*),Bash(cat:*),Bash(diff:*),Bash(jq:*)"
