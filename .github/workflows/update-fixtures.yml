name: Update Niconico Fixtures

on:
  # Daily execution at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

  # Manual execution
  workflow_dispatch:
    inputs:
      force_issue_creation:
        description: 'Force issue creation even without changes (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      triage:
        description: 'Run the triage skill on the issue this run opens'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: write  # Allow git push
  issues: write    # Allow creating issues

jobs:
  update-fixtures:
    name: Update Niconico Fixtures
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-${{ github.event.repository.name }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-${{ github.event.repository.name }}-

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # Install this package with dev dependencies
          pip install -e ".[dev]"

      - name: Update Niconico fixtures
        id: generate
        # Report collection failures through the remaining steps, then fail the job at the end
        continue-on-error: true
        # "bash" (rather than the default "bash -e") adds pipefail, so the exit status of the
        # generator is not masked by tee
        shell: bash
        env:
          NICONICO_SESSION: ${{ secrets.NICONICO_SESSION }}
        run: |
          ./scripts/run_fixture_generator.sh 2>&1 | tee fixture-update.log

      - name: Check for fixture changes
        id: check_changes
        run: |
          if [ ! -d "src/fixture_data/fixtures" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No fixtures directory found"
          else
            # Add all files to staging to detect new files
            git add src/fixture_data/ 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "changes=false" >> $GITHUB_OUTPUT
              echo "No fixture changes detected"
            else
              echo "changes=true" >> $GITHUB_OUTPUT
              echo "Fixture changes detected"
              git diff --cached --name-only > changed-files.txt
              git diff --cached --stat > diff-stat.txt
              echo "file_count=$(git diff --cached --name-only | wc -l)" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update fixtures: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
      - name: Create issue for fixture updates
        id: create_issue
        if: steps.check_changes.outputs.changes == 'true' || steps.generate.outcome == 'failure' || github.event.inputs.force_issue_creation == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const fileCount = '${{ steps.check_changes.outputs.file_count }}' || '0';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Read files safely (they may not exist if no changes)
            let changedFiles = 'No changes detected';
            let diffStat = 'No changes detected';

            if (fs.existsSync('changed-files.txt')) {
              changedFiles = fs.readFileSync('changed-files.txt', 'utf8').trim();
            }
            if (fs.existsSync('diff-stat.txt')) {
              diffStat = fs.readFileSync('diff-stat.txt', 'utf8').trim();
            }

            const generationFailed = '${{ steps.generate.outcome }}' === 'failure';
            let failedFixtures = 'See the update log for details';
            if (fs.existsSync('fixture-failures.txt')) {
              failedFixtures = fs.readFileSync('fixture-failures.txt', 'utf8').trim();
            }
            const failureSection = generationFailed ? `
            ### Collection Failures

            The fixtures below could not be collected. Their files on disk are stale, not
            confirmed unchanged, so the Diff Summary below covers only the fixtures that were fetched.

            \`\`\`
            ${failedFixtures}
            \`\`\`
            ` : '';

            const updateLog = fs.readFileSync('fixture-update.log', 'utf8');

            // Truncate log if too long (GitHub issue body limit is ~65536 chars)
            const maxLogLength = 50000;
            const truncatedLog = updateLog.length > maxLogLength
              ? updateLog.substring(0, maxLogLength) + '\n\n... (truncated, see artifact for full log)'
              : updateLog;

            const issueBody = `## Fixture Update Summary

            **Date:** ${date}
            **Changed Files:** ${fileCount}
            **Workflow Run:** [View Details](${runUrl})
            **Collection Status:** ${generationFailed ? 'FAILED - see Collection Failures below' : 'OK'}
            ${failureSection}

            ### Changed Files
            \`\`\`
            ${changedFiles}
            \`\`\`

            ### Diff Summary
            \`\`\`
            ${diffStat}
            \`\`\`

            ### Update Log
            <details>
            <summary>Click to expand log (${updateLog.length} bytes)</summary>

            \`\`\`
            ${truncatedLog}
            \`\`\`
            </details>

            ### Next Steps

            The fixtures have been automatically updated and committed to this repository.

            **Before applying to Music Assistant server:**

            1. Review the changes in the [latest commit](https://github.com/${context.repo.owner}/${context.repo.repo}/commits/main)
            2. **Verify locally** - Copy updated fixtures and run tests:
               \`\`\`bash
               # Clone this repository if not already done
               git clone https://github.com/${context.repo.owner}/${context.repo.repo}.git
               cd ${context.repo.repo}
               git pull

               # Copy fixtures to Music Assistant server repository
               cp -r fixtures/* /path/to/music-assistant/server/tests/providers/nicovideo/fixtures/

               # Run tests in the server repository
               cd /path/to/music-assistant/server
               pytest tests/providers/nicovideo/ -v
               \`\`\`
            3. If all tests pass, create a PR in the server repository with the updated fixtures
            `;

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Automated] Fixture Update - ${date}${generationFailed ? ' (collection failed)' : ''}`,
              body: issueBody,
              labels: ['automated', 'fixture-update']
            });
            core.setOutput('issue_number', String(issue.number));

      - name: Fail if fixture collection failed
        if: steps.generate.outcome == 'failure'
        run: |
          echo "Fixture collection reported failures; see the Update Niconico fixtures step."
          exit 1

  triage:
    name: Triage fixture issue
    needs: update-fixtures
    # always(): the update job fails on collection errors, and those issues need triage most
    if: >-
      always()
      && needs.update-fixtures.outputs.issue_number != ''
      && github.event.inputs.triage != 'false'
    uses: ./.github/workflows/triage-fixture-issue.yml
    with:
      issue_number: ${{ needs.update-fixtures.outputs.issue_number }}
    secrets: inherit
    permissions:
      contents: write
      issues: write
      actions: read
